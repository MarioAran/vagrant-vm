---
- name: Configurar VM DevOps con WordPress
  hosts: all
  become: yes
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Actualizar apt cache
      raw: apt-get update -y
      changed_when: false

    - name: Instalar Python y paquetes esenciales
      raw: apt-get install -y python3 python3-apt python3-pip curl wget git htop
      changed_when: false

    - name: Recopilar facts del sistema
      setup:

    # LIMPIAR CONFIGURACIONES PREVIAS DE DOCKER
    - name: Eliminar configuraciones antiguas de Docker
      shell: |
        rm -f /etc/apt/sources.list.d/docker.list
        rm -f /etc/apt/keyrings/docker.asc
        rm -f /usr/share/keyrings/docker-archive-keyring.gpg
        rm -f /etc/apt/keyrings/docker.gpg
      changed_when: false
      ignore_errors: yes

    # INSTALAR DOCKER
    - name: Instalar dependencias de Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Crear directorio para keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Añadir clave GPG de Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      changed_when: false

    - name: Añadir repositorio de Docker
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      changed_when: false

    - name: Actualizar apt con repositorio de Docker
      apt:
        update_cache: yes

    - name: Instalar Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Añadir usuario al grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Habilitar Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # INSTALAR LIBRERÍA DE DOCKER PARA PYTHON
    - name: Instalar docker-py (necesario para el módulo docker_compose)
      pip:
        name: docker
        state: present

    # CONFIGURAR WORDPRESS
    - name: Crear directorios para datos persistentes de WordPress
      file:
        path: "/home/{{ ansible_user }}/Desktop/wordpress/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - db_data
        - wordpress_data

    - name: Descargar docker-compose.yml desde repositorio
      get_url:
        url: https://raw.githubusercontent.com/MarioAran/MarioCode/master/docker/docker-compose.yml
        dest: "/home/{{ ansible_user }}/docker-compose.yml"
        mode: '0644'

    - name: Levantar los contenedores con Docker Compose
      community.docker.docker_compose_v2:
        project_src: "/home/{{ ansible_user }}"
        state: present
      register: compose_output

    - name: Esperar a que MySQL esté completamente listo
      pause:
        seconds: 20
        prompt: "Esperando a que MySQL inicialice..."
        
    - name: Verificar que los contenedores están corriendo
      command: docker ps 
      register: containers_status
      changed_when: false
    
    - name: Mostrar información de acceso
      debug:
        msg:
          - "✅ WordPress desplegado correctamente!"
          - "🌐 Accede a WordPress en: http://{{ ansible_default_ipv4.address }}:8000"
          - "🔑 Usuario de BD: wp_user | Contraseña: Passw0rd"
          - "📁 Los datos se guardan en ~/Desktop/wordpress/"
          - ""
          - "📝 Comandos útiles dentro de la VM:"
          - "  docker ps                    # Ver contenedores activos"
          - "  docker logs wordpress-app    # Ver logs de WordPress"
          - "  cd ~ && docker-compose down  # Detener WordPress"
          - "  cd ~ && docker-compose up -d # Reiniciar WordPress"
       